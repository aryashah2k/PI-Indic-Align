seed: 42
device: auto
num_workers: 0
batch_size: 64

tasks: [t1_mono_retrieval, t2_xling_retrieval, t3_reverse_retrieval]

backbones:
  - bge-m3
  - e5-large-instruct
  - labse
  - indic-sbert
  - indic-sbert-nli

languages: []
language_pairs: []

top_k: [1, 5, 10]

bm25:
  tokenizer: whitespace
  k1: 1.5
  b: 0.75

classification:
  estimator: logistic_regression
  params:
    penalty: l2
    solver: liblinear
    max_iter: 200
    class_weight: null
    C: 1.0
  calibration:
    method: temperature
    bins: 15

hard_negatives:
  metric: token_set_ratio
  threshold: 70
  max_negatives_per_query: 10

embedding_prompts:
  bge-m3:
    query_prefix: "Represent this sentence for searching relevant passages: "
    doc_prefix: "Represent this sentence for retrieving relevant passages: "
  e5-large-instruct:
    query_prefix: "Instruct: "
    doc_prefix: "Passage: "
  labse:
    query_prefix: ""
    doc_prefix: ""
  indic-sbert:
    query_prefix: ""
    doc_prefix: ""
  indic-sbert-nli:
    query_prefix: ""
    doc_prefix: ""

logging:
  level: INFO
  warnings_as_errors: true

output:
  results_dir: results
  visualizations_dir: visualizations
  logs_dir: results/logs
