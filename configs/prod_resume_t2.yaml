seed: 42
device: auto
num_workers: 0
batch_size: 64

# Resume only T2 cross-lingual retrieval
# Runner will skip pairs with existing results automatically (resume-safe)
tasks: [t2_xling_retrieval]

backbones:
  - bge-m3
  - intfloat/multilingual-e5-large-instruct
  - sentence-transformers/LaBSE
  - l3cube-pune/indic-sentence-similarity-sbert
  - l3cube-pune/indic-sentence-bert-nli

languages: []
language_pairs: []

splits:
  random:
    train_frac: 0.7
    dev_frac: 0.1
    test_frac: 0.2
    seed: 42
  lolo:
    target: null
  filters:
    shot_types: []

top_k: [1, 5, 10]

bm25:
  tokenizer: whitespace
  k1: 1.5
  b: 0.75

embedding_prompts:
  bge-m3:
    query_prefix: "Represent this sentence for searching relevant passages: "
    doc_prefix: "Represent this sentence for retrieving relevant passages: "
  intfloat/multilingual-e5-large-instruct:
    query_prefix: "Instruct: "
    doc_prefix: "Passage: "
  sentence-transformers/LaBSE:
    query_prefix: ""
    doc_prefix: ""
  l3cube-pune/indic-sentence-similarity-sbert:
    query_prefix: ""
    doc_prefix: ""
  l3cube-pune/indic-sentence-bert-nli:
    query_prefix: ""
    doc_prefix: ""

logging:
  level: INFO
  warnings_as_errors: true

output:
  results_dir: results
  visualizations_dir: visualizations
  logs_dir: results/logs
