seed: 42
device: auto
num_workers: 0
batch_size: 32

tasks: [t5_hardneg_eval]

backbones:
  - bge-m3

languages: [hin, tam]
language_pairs: []

splits:
  random:
    train_frac: 0.7
    dev_frac: 0.1
    test_frac: 0.2
    seed: 42
  lolo:
    target: null
  filters:
    shot_types: []

hard_negatives:
  metric: token_set_ratio
  threshold: 70
  max_negatives_per_query: 5

embedding_prompts:
  bge-m3:
    query_prefix: "Represent this sentence for searching relevant passages: "
    doc_prefix: "Represent this sentence for retrieving relevant passages: "

logging:
  level: INFO
  warnings_as_errors: true

output:
  results_dir: results
  visualizations_dir: visualizations
  logs_dir: results/logs
